# Options affecting the basic behavior of iDisguise (including the developer API)
disguise:
   
   # Blacklist of disguise types:
   # Default ones are unsupported, add any one if you would like to disable it
   disguise-type-blacklist: DISGUISE_TYPE_BLACKLIST

   # Blacklist of player disguises:
   # Add any player name if you would like to disable it
   player-disguise-blacklist: PLAYER_DISGUISE_BLACKLIST

   # Are player disguises visible to the disguised players themselves in 3rd person view?
   # if true: a dummy world 'iDisguiseDummyWorld' is created, which is necessary to realize this feature.
   player-disguise-viewself: PLAYER_DISGUISE_VIEWSELF

   # Should disguised players still appear in the tab list (player list) for everyone else?
   # if true: a tab-list ADD_PLAYER packet is re-sent after the player entity is hidden, so observers
   #   still see the player's name in tab while the disguise mob is what they see in the world.
   # if false: the player vanishes from tab while disguised (the original iDisguise behavior).
   # Only affects mob disguises; player disguises always remain in tab.
   keep-tab-list-when-disguised: KEEP_TAB_LIST_WHEN_DISGUISED

   # Verbose logging for diagnosing disguise issues (cross-world transitions, denied mob spawns,
   # orphan-cleanup events, NMS injection failures, etc.). Leave false on production servers.
   debug-mode: DEBUG_MODE

   # Keep the player disguised across a leave/rejoin within the same session.
   # if true: on quit, the disguise is recorded in memory and re-applied automatically when the
   #   player rejoins. The disguise mob is despawned on quit and a fresh one is spawned on rejoin.
   #   State is never written to disk -- a server restart clears every entry, so everyone joins
   #   undisguised after a restart.
   # if false: quitting undisguises the player immediately (the original behavior).
   persist-on-quit: PERSIST_DISGUISE_ON_QUIT

   # Per-player cooldown (in seconds) between disguise attempts via /disguise. Prevents players
   # from rapidly cycling through mob disguises to escape combat or scout. Applies only to
   # self-disguises (/odisguise on others is unaffected). Players with the iDisguise.* permission
   # bypass the cooldown. Set to 0 to disable.
   cooldown-seconds: DISGUISE_COOLDOWN_SECONDS

   # Block ender-pearl throws while a player is disguised. The disguise mob occupies the player's
   # location and would otherwise eat the pearl (looks like it returns to hand). Letting pearls
   # through reliably would require nudging the projectile past the mob's hitbox, which opens up
   # wall-glitch exploits in tight spaces -- so the safe default is to disallow them entirely.
   disable-enderpearls-while-disguised: DISABLE_ENDERPEARLS_WHILE_DISGUISED

# Options affecting the commands and permissions of iDisguise (these do NOT affect the developer API)
commands:

   # Whitelist of statements to alter the disguises:
   # add/remove any one if you would like to enable/disable it
   statement-whitelist: STATEMENT_WHITELIST

   # Do we use permission nodes?
   # if true: require permission node 'iDisguise.disguise.<ENTITYTYPE>' or 'iDisguise.disguise.*' to disguise
   # if false: only server operators can disguise
   use-permission-nodes: USE_PERMISSION_NODES

# Mob-sound action: shift + right-click while holding a sword and disguised plays the
# disguise mob's ambient sound to nearby players.
mob-sound:

   # Master toggle for the feature.
   enabled: MOB_SOUND_ENABLED

   # Per-player cooldown in seconds between sound plays.
   cooldown-seconds: MOB_SOUND_COOLDOWN_SECONDS

# Options affecting the update checking feature
updates:
   
   # Check whether an update is available at every server start
   check: UPDATE_CHECK
   
   # Automatically download new updates
   download: UPDATE_DOWNLOAD

# For internal purposes only
version: VERSION
